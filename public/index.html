      /* Core Styles */
      * {

        text-align: right;
      }

        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      }

          transform: translateX(0);
        }

      /* Professional Card Effect - Glass Morphism */
      .holographic-card {
        background: rgba(17, 24, 39, 0.8);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(59, 130, 246, 0.2);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1), 0 2px 4px rgba(0, 0, 0, 0.06);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .holographic-card:hover {
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2),
          0 10px 10px -5px rgba(0, 0, 0, 0.04),

      }

      .professional-text {
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      /* Gradient Text */
      .gradient-text {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Loading Spinner */
      .spinner {
        border: 3px solid rgba(59, 130, 246, 0.3);
        border-top-color: #3b82f6;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Hamburger Menu Styles */
      .hamburger-menu {
        position: fixed;
        top: 0;
        right: -100%;
        width: 300px;
        height: 100vh;
        background: rgba(17, 24, 39, 0.98);
        backdrop-filter: blur(20px);
        box-shadow: -4px 0 20px rgba(0, 0, 0, 0.3);
        transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        overflow-y: auto;
      }

      .hamburger-menu.open {
        right: 0;
      }

      .hamburger-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 999;
      }

      .hamburger-overlay.open {

      }

          if (!this.recognition) this.init();
          if (!this.recognition) {
            if (onError) onError("Speech recognition not supported");

          if (this.isListening) {

            return;

          };

            console.error("[Voice] Failed to start:", e);

      window.handleChatSubmit = async function (e) {
        e.preventDefault();
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;

        state.messages.push({ role: "user", text });
        input.value = "";
        render();

        setTimeout(() => {
          const chatContainer = document.getElementById("chat-messages");
          if (chatContainer)
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }, 50);

        try {
          const response = await AIHub.generate(text, "", state.messages);
          state.messages.push({ role: "bot", text: response });
          render();
          setTimeout(() => {
            const chatContainer = document.getElementById("chat-messages");
            if (chatContainer)
              chatContainer.scrollTop = chatContainer.scrollHeight;
          }, 50);
        } catch (err) {
          state.messages.push({
            role: "bot",
            text: "I'm having trouble connecting. Please try again.",
          });
          render();
        }
      };

      window.startVoiceInput = function () {
        state.isVoiceRecording = !state.isVoiceRecording;

        if (state.isVoiceRecording) {
          VoiceEngine.listen(
            (transcript, isFinal) => {
              state.voiceTranscript = transcript;
              render();

              if (isFinal) {
                const input = document.getElementById("chat-input");
                if (input) {
                  input.value = transcript;
                  state.isVoiceRecording = false;
                  state.voiceTranscript = "";
                  render();
                }
              }
            },
            (error) => {
              console.error("Voice error:", error);
              state.isVoiceRecording = false;
              state.voiceTranscript = "";
              showToast("Voice input error: " + error, "error");
              render();

      function render() {
        let content = renderNavbar();

        switch (state.view) {
          case "home":
            content += renderHero();
            content += renderFeatures();
            break;
          case "features":
            content += renderFeatures();
            break;
          case "templates":
            content += renderTemplates();
            break;
          case "builder":
            content += renderBuilder();
            break;
          case "pricing":
            content += renderPricing();
            break;
          case "about":
            content += renderAboutUs();
            break;
          case "privacy":
            content += renderPrivacyPolicy();
            break;
          case "faqs":
            content += renderFAQs();
            break;
          case "terms":
            content += renderTerms();
            break;
          case "contact":
            content += renderContact();
            break;
          default:
            content += renderHero();
        }

        content += renderFooter();
        content += renderChatBot();
        content += renderPaymentModal();
        content += renderHamburgerMenu();

        document.getElementById("root").innerHTML = content;
      }

      // Firebase auth listener
      if (auth && typeof auth.onAuthStateChanged === "function") {
        auth.onAuthStateChanged((user) => {
          state.userProfile = user;
