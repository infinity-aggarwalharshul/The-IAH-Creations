name: the_iah_creations_app
description: "The IAH Creations - AI-Powered Web Development Platform"
publish_to: "none"
version: 5.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4

  # Firebase (Uncomment when google-services.json is ready)
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0
  # firebase_analytics: ^10.8.0

  # AI
  google_generative_ai: ^0.2.0

  # UI / UX
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.6.0
  glassmorphism_ui: ^0.3.0

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/upi_qr.jpg" # Using QR as placeholder icon since no logo provided, user should replace
  min_sdk_android: 21 # Ensure compatibility

flutter:
  uses-material-design: true
  assets:
    - assets/
