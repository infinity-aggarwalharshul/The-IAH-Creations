        if (SpeechRecognition) {
          this.recognition = new SpeechRecognition();
          this.recognition.continuous = false;
          this.recognition.interimResults = true;
          this.recognition.lang = "en-US";
          console.log("%c🎤 Voice recognition initialized", "color: purple");
        } else {
          console.warn("⚠️ Speech recognition not supported");
        }
      },

      speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      },

      listen(onResult, onError) {
        if (!this.recognition) this.init();
        if (!this.recognition) {
          if (onError) onError("Speech recognition not supported");
          return;
        }

        if (this.isListening) {
          this.stopListening();
          return;
        }

        this.isListening = true;
        console.log("🎤 Listening...");

        this.recognition.onresult = (event) => {
          const transcript = Array.from(event.results)
            .map((result) => result[0].transcript)
            .join("");
          if (onResult) onResult(transcript, event.results[0].isFinal);
        };

        this.recognition.onerror = (event) => {
          console.error("[Voice] Error:", event.error);
          this.isListening = false;
          if (onError) onError(event.error);
        };

        this.recognition.onend = () => {
          this.isListening = false;
          console.log("🎤 Stopped listening");
        };

        try {
          this.recognition.start();
        } catch (e) {
          console.error("[Voice] Failed to start:", e);
          this.isListening = false;
          if (onError) onError(e.message);
        }
      },

      stopListening() {
        if (this.recognition && this.isListening) {
          this.recognition.stop();
          this.isListening = false;
        }
      },
    };

    const AutoUpdateHub = {

      swUpdateAvailable: false,

      init() {
        const lastCheck = localStorage.getItem("last_update_check");
        const now = Date.now();
        if (!lastCheck || now - parseInt(lastCheck) > this.updateCheckInterval) {
          this.checkForUpdates();
        }
        // Register service worker for offline & auto-update support
        this.initServiceWorker();
        // Listen for SW updates
        this.listenForSWUpdates();
        console.log("%c🔄 AutoUpdateHub: Initialized (v" + APP_VERSION + ")", "color: gray; font-size: 10px");

      async initServiceWorker() {
        if ('serviceWorker' in navigator) {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            console.log("%c✅ Service Worker registered", "color: gray; font-size: 10px");
          } catch(e) {
            console.log("%c⚠ SW registration failed (expected in dev)", "color: gray; font-size: 10px");
          }
        }
      },

      listenForSWUpdates() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log("%c🔄 New version activated silently", "color: gray; font-size: 10px");
          });
        }
      },

      async checkForUpdates() {
        try {
          console.log("%c🔄 Checking for updates...", "color: gray; font-size: 10px");
          localStorage.setItem("last_update_check", Date.now().toString());
          // Fetch latest release from GitHub (silent)
          const response = await fetch(this.updateURL + "?t=" + Date.now());
          if (response.ok) {
            const release = await response.json();
            const latestVersion = release.tag_name?.replace('v', '') || APP_VERSION;
            if (latestVersion !== APP_VERSION) {
              localStorage.setItem("update_available", latestVersion);
              console.log("%c🆕 Update available: v" + latestVersion, "color: blue; font-size: 10px");
              // Silently cache and auto-apply on next load
              this.scheduleUpdate();
            } else {
              console.log("%c✓ Up to date (v" + APP_VERSION + ")", "color: gray; font-size: 10px");
            }
          }
        } catch (error) {
          console.log("%c⚠ Update check failed silently", "color: gray; font-size: 10px");
        }
      },

      scheduleUpdate() {
        // Apply update on next page focus (user-transparent)
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            this.applyUpdate();
          }
        }, { once: true });
      },

      applyUpdate() {
        const updateVersion = localStorage.getItem("update_available");
        if (updateVersion) {
          localStorage.removeItem("update_available");
          // Reload with cache bypass to apply update
          window.location.reload(true);
        }
      },
    };

    window.handleContactSubmit = async function (e) {

      const email = form.querySelector('input[type="email"]').value;
      const message = form.querySelector("textarea").value;

      try {
        if (db && isFirebaseReady) {
          await addDoc(
            collection(db, getCollectionPath("contact_requests")),
            {
              name,
              email,
              message,
              timestamp: serverTimestamp(),
              status: "new",
            }
          );
        }
        showToast("✅ Message sent successfully!");
        form.reset();
      } catch (error) {
        console.error("Error:", error);
        showToast("❌ Error sending message", "error");
      }
    };

    window.selectProjectType = function (type) {

    window.handlePromptSubmit = async function (e) {
      e.preventDefault();
      const description = document.getElementById("app-description").value;
      const type = state.selectedProjectType || "website";

      if (!description) {
        showToast("Please describe your app first", "error");
        return;
      }

      const button = e.target.querySelector("button");
      const originalText = button.innerHTML;
      button.innerHTML = `<div class="spinner border-white mr-2"></div> Generating...`;
      button.disabled = true;

      await PromptToAppHub.generateApp(description, type);

      button.innerHTML = originalText;
      button.disabled = false;
      render();
    };

      if (state.generatedCode) {
        await PromptToAppHub.deployCode(state.generatedCode.code);
      }
    };

    window.buyTemplate = function (id) {
      const template = PaymentHub.findTemplate(id);
      if (template) {
        state.activeTemplate = template;
        state.cartOpen = false;
        render();
      }
    };

    window.closePaymentModal = function () {
      state.activeTemplate = null;
      render();
    };

    window.processPayment = async function (method) {
      if (state.activeTemplate) {
        await PaymentHub.processPayment(state.activeTemplate.id, method);
        if (method === "upi" || method === "gpay" || method === "paypal") {
          setTimeout(() => {
            closePaymentModal();

        }

    };

    function render() {
      let content = renderNavbar();

      switch (state.view) {
        case "home":
          content += renderHero();
          content += renderFeatures();
          break;
        case "features":
          content += renderFeatures();
          break;
        case "templates":
          content += renderTemplates();
          break;
        case "builder":
          content += renderBuilder();
          break;
        case "pricing":
          content += renderPricing();
          break;
        case "about":
          content += renderAboutUs();
          break;
        case "privacy":
          content += renderPrivacyPolicy();
          break;
        case "faqs":
          content += renderFAQs();
          break;
        case "terms":
          content += renderTerms();
          break;
        case "contact":
          content += renderContact();
          break;
        default:
          content += renderHero();
      }

      content += renderFooter();
      content += renderChatBot();
      content += renderPaymentModal();
      content += renderCartModal();
      content += renderHamburgerMenu();

      document.getElementById("root").innerHTML = content;
    }

    // ============================================

    // ============================================

      `%c🚀 The IAH Creations Platform v${APP_VERSION}`,

    // Initialize auto-update feature (silent)
    AutoUpdateHub.init();

    // Initial render
    render();

    // Firebase auth listener
    if (auth && typeof auth.onAuthStateChanged === "function") {
      auth.onAuthStateChanged((user) => {
        state.userProfile = user;
        if (user) {
          console.log("%c👤 User authenticated:", "color: green", user.uid);
        }
      });

      if (!auth.currentUser) {
        signInAnonymously(auth).catch((e) => console.warn("Auth error:", e));
