        'success': 'bg-green-500',
        'error': 'bg-red-500',
        'info': 'bg-blue-500',
        'warning': 'bg-yellow-500'
      };
      
      toast.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-lg shadow-lg animate-fade-in`;
